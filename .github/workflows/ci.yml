name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  packages:
    name: Packages (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22'
          - os: ubuntu-24.04
            node: '24'
          - os: windows-2022
            node: '24'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.13.0
      - run: npm ci
      - run: npm test
      - run: npm run check:generated
      - run: npm run test:packed
      - run: npm run test:size
      - run: npm audit --omit=dev --audit-level=high

  browsers:
    name: Chromium, Firefox and WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@11.13.0
      - run: npm ci
      - run: npm run build
      - run: npm run browser:install -- --with-deps
      - run: npm run test:browser
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: failure()
        with:
          name: browser-failures
          path: |
            dist/playwright-report
            dist/browser-results
          retention-days: 3
          if-no-files-found: ignore
